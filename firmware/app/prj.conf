# Application UBRI (nRF52840). Les valeurs Bluetooth suivent le débit calculé du cahier (trame v3 : 42 octets à
# 250 Hz = 10,5 ko/s) ; elles sont à mesurer sur la vraie liaison (cahier §8).
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y
CONFIG_LOG=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="UBRI"
# une trame v3 (42 octets) ne tient pas dans les 20 octets utiles d'un ATT MTU de 23 : MTU 247
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
# la carte demande elle-même la MTU 247 après l'appairage (bt_gatt_exchange_mtu = côté client GATT)
CONFIG_BT_GATT_CLIENT=y
# EEG = donnée de santé : appairage LE Secure Connections SEULEMENT, authentifié (clé ALÉATOIRE à chaque appairage,
# affichée sur la console), accepté seulement pendant la fenêtre d'appairage (pairing_accept) ; liaisons mémorisées
# en flash : un hôte déjà lié se reconnecte sans nouvel appairage.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_MAIN_STACK_SIZE=2048
